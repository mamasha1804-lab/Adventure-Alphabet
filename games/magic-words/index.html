<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magic Words I–Q</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#efe9fb}nav{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#fff;border-bottom:2px solid #7d4bd3;box-shadow:0 3px 12px rgba(70,40,120,.12)}nav a{text-decoration:none;font-weight:800;color:#583391;padding:8px 12px;border:2px solid #d8c4f4;border-radius:999px}nav a.next{background:#7342c8;color:#fff;border-color:#7342c8}iframe{display:block;width:100%;height:calc(100% - 52px);border:0;background:#efe9fb}#loading{position:fixed;inset:52px 0 0;display:grid;place-items:center;color:#654094;font-weight:800;font-size:20px;background:#efe9fb;z-index:2}</style></head><body><nav><a href="../index.html">🏠 Все игры</a><strong>Magic Words I–Q</strong><a class="next" href="../my-letters/index.html">← My Letters A–H</a></nav><div id="loading">Загрузка игры…</div><iframe id="game" title="Magic Words I–Q"></iframe><script>const parts=Array.from({length:10},(_,i)=>`part-${String(i).padStart(2,'0')}.txt`);Promise.all(parts.map(p=>fetch(p).then(r=>{if(!r.ok)throw new Error(p);return r.text()}))).then(a=>{const blob=new Blob([a.join('')],{type:'text/html'});document.getElementById('game').src=URL.createObjectURL(blob);document.getElementById('loading').remove()}).catch(e=>{document.getElementById('loading').textContent='Не удалось загрузить игру: '+e.message});</script></body></html>
